[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.1.0"
description = "Emulated onboard satellite pipeline that scores and prioritizes image tiles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-image",
    "pyyaml",
    "matplotlib",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
